# Playwright worker: scrape ML ofertas and POST to Aventa ingest.
# Public repo → Actions minutes are free on standard GitHub-hosted runners.
#
# S7: WORKER_DISCOVERY_ONLY defaults to 1 (dryRun — snapshots yes, INSERT no).
# Override via repo variable WORKER_DISCOVERY_ONLY or workflow_dispatch input.
# Even with discovery_only=0, server still requires BOT_INGEST_MACHINE_PENDING_WRITES=1
# (default OFF) plus BOT_INGEST_ENABLED and bot author IDs — fail-closed.
#
# Observado en produccion: con '*/30' este workflow corria cada 2-5 h, no cada
# 30 min. Dos causas y sus mitigaciones:
#
# 1. Los minutos redondos ('*/30' = :00 y :30) son la franja mas disputada de
#    GitHub Actions y las ejecuciones programadas se encolan detras de todo el
#    mundo. Usamos minutos primos fuera de esa franja.
# 2. 'cancel-in-progress: true' hacia que, cuando GitHub liberaba varias
#    ejecuciones retrasadas de golpe, unas mataran a otras y solo sobreviviera
#    la ultima. Ahora se encolan; el ciclo dura ~90 s, asi que no se acumulan.
#
# GitHub no garantiza puntualidad en ningun caso. El panel /admin/hunter mide el
# intervalo REAL con Scheduler health en vez de confiar en este cron.
name: Mercado Libre Worker

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      discovery_only:
        description: '1 = dryRun (default, no DB insert). 0 = allow POST without dryRun (server write flag still required).'
        required: false
        default: '1'

concurrency:
  group: mercadolibre-worker
  cancel-in-progress: false

jobs:
  scrape-and-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: workers/mercadolibre-worker

    env:
      AVENTA_INGEST_ENDPOINT: https://aventaofertas.com/api/cron/bot-ingest-candidates
      # Sticky = Supply Engine server/API (observeStickySkus). No Playwright PDP seeds.
      AVENTA_CRON_SECRET: ${{ secrets.AVENTA_CRON_SECRET }}
      WORKER_PROFILE: standard
      WORKER_HEADLESS: '1'
      # Default discovery-only. Variable override > dispatch input > '1'.
      WORKER_DISCOVERY_ONLY: ${{ vars.WORKER_DISCOVERY_ONLY || github.event.inputs.discovery_only || '1' }}
      # Amplitud sobre profundidad: pocas cards por superficie y muchas superficies.
      # Con 3 por seed el ciclo alcanza a visitar 12 de las 14 del registro.
      WORKER_MAX_ITEMS: '36'
      WORKER_MAX_PER_SEED: '3'
      WORKER_MIN_DISCOUNT_PERCENT: '18'
      WORKER_TIMEOUT_MS: '45000'
      # Las seeds viven en workers/mercadolibre-worker/src/seeds.mjs, no aqui:
      # agregar una superficie no deberia obligar a editar la definicion del cron.
      # WORKER_ML_SEEDS sigue existiendo como override manual de emergencia.

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Require ingest secret
        run: |
          if [ -z "$AVENTA_CRON_SECRET" ]; then
            echo "Falta el secret AVENTA_CRON_SECRET en GitHub (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Log S7 ops mode
        run: |
          echo "WORKER_DISCOVERY_ONLY=$WORKER_DISCOVERY_ONLY"
          echo "dryRun expected=$( [ \"$WORKER_DISCOVERY_ONLY\" = \"1\" ] || [ \"$WORKER_DISCOVERY_ONLY\" = \"true\" ] && echo yes || echo no )"
          echo "Server still requires BOT_INGEST_MACHINE_PENDING_WRITES=1 for real pending inserts."

      - name: Install npm dependencies
        run: npm install

      - name: Install Playwright Chromium + OS deps
        run: npx playwright install --with-deps chromium

      - name: Run worker
        run: npm start
