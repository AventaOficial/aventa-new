# Playwright worker: scrape ML ofertas and POST to Aventa ingest.
# Schedule every 30m (not 15m) to reduce runner load and cron drift.
# Public repo → Actions minutes are free on standard GitHub-hosted runners.
name: Mercado Libre Worker

on:
  schedule:
    # Every 30 minutes. GitHub may delay cron by several minutes.
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: mercadolibre-worker
  cancel-in-progress: true

jobs:
  scrape-and-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers/mercadolibre-worker

    env:
      AVENTA_INGEST_ENDPOINT: https://aventaofertas.com/api/cron/bot-ingest-candidates
      AVENTA_CRON_SECRET: ${{ secrets.AVENTA_CRON_SECRET }}
      WORKER_PROFILE: standard
      WORKER_HEADLESS: '1'
      WORKER_MAX_ITEMS: '12'
      WORKER_MIN_DISCOUNT_PERCENT: '15'
      WORKER_TIMEOUT_MS: '45000'
      WORKER_ML_SEEDS: >-
        https://www.mercadolibre.com.mx/ofertas#nav-header,https://www.mercadolibre.com.mx/ofertas?container_id=MLM779363-1&promotion_type=lightning

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Require ingest secret
        run: |
          if [ -z "$AVENTA_CRON_SECRET" ]; then
            echo "Falta el secret AVENTA_CRON_SECRET en GitHub (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Install npm dependencies
        run: npm install

      - name: Install Playwright Chromium + OS deps
        run: npx playwright install --with-deps chromium

      - name: Run worker
        run: npm start
