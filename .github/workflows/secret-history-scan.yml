name: Secret history scan

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan full Git history for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.0'
          cache: false

      - name: Install pinned Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan all reachable Git history
        env:
          GOTOOLCHAIN: local
          GITLEAKS_CONFIG: .gitleaks.toml
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --log-opts="--all" --redact --verbose
