name: Secret history scan

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan full Git history for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks binary and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          tar -xzf "$archive" -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan all reachable Git history
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
        run: /tmp/gitleaks git --log-opts="--all" --redact --verbose
